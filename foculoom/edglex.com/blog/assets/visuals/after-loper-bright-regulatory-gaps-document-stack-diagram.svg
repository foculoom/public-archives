<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="400" y="60" width="400" height="80" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="420" y="95" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Two Doctrines, One</text>
  <text x="420" y="115" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Structural Shift</text>
  <text x="420" y="120" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Understanding the gap requires</text>
  <text x="420" y="134" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">understanding how the two</text>
  <text x="420" y="148" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">doctrines interact.</text>
  <rect x="380" y="160" width="400" height="80" fill="#F1F5F9" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="400" y="195" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">How Gaps Form in the</text>
  <text x="400" y="215" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">New Landscape</text>
  <text x="400" y="220" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Regulatory gaps do not only form</text>
  <text x="400" y="234" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">where no law exists.</text>
  <rect x="360" y="260" width="400" height="80" fill="#E2E8F0" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="380" y="295" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">The AI Regulation Case</text>
  <text x="380" y="315" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Study</text>
  <text x="380" y="320" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">The gap created by Loper Bright</text>
  <text x="380" y="334" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">and the major questions doctrine</text>
  <text x="380" y="348" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">is most visible in AI</text>
  <text x="380" y="362" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">regulation.</text>
