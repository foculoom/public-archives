<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="400" y="60" width="400" height="80" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="420" y="95" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What Is Actually in</text>
  <text x="420" y="115" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Front of the Market</text>
  <text x="420" y="120" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">The June 5, 2026 FDIC proposed</text>
  <text x="420" y="134" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">rule for FDIC-supervised</text>
  <text x="420" y="148" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">permitted payment stablecoin</text>
  <text x="420" y="162" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">issuers places these issuers</text>
  <rect x="380" y="160" width="400" height="80" fill="#F1F5F9" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="400" y="195" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Why This Is a Gap, Not</text>
  <text x="400" y="215" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Just “Normal…</text>
  <text x="400" y="220" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Rulemaking always contains</text>
  <text x="400" y="234" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">uncertainty.</text>
  <rect x="360" y="260" width="400" height="80" fill="#E2E8F0" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="380" y="295" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What Teams Should Do</text>
  <text x="380" y="315" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">During the Transition…</text>
  <text x="380" y="320" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Use the current period to build</text>
  <text x="380" y="334" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">control maps, not final</text>
  <text x="380" y="348" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">controls.</text>
</svg>