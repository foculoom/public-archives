<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="40" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="40" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="60" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What Mayer Brown</text>
  <text x="60" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Reports the Order Did</text>
  <rect x="433" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="433" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="453" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Why Rule 26 Framing</text>
  <text x="453" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Matters</text>
  <rect x="826" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="826" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="846" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">The Stay Is Not the</text>
  <text x="846" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">End of the Story</text>
  <text x="60" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Mayer Brown's June 10, 2026</text>
  <text x="60" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">litigation update reports that</text>
  <text x="60" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Magistrate Judge Thomas O.</text>
  <text x="453" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Rule 26 discovery disputes</text>
  <text x="453" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">often turn on whether</text>
  <text x="453" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">requested materials are tied</text>
  <text x="453" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">to the basis of an expert</text>
  <text x="453" y="202" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">opinion.</text>
  <text x="846" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">The reported stay pending Rule</text>
  <text x="846" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">72(a) objection means this</text>
  <text x="846" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">issue remains live.</text>
