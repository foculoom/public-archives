<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="40" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="40" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="60" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What the Sanctions</text>
  <text x="60" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Actually Require</text>
  <rect x="433" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="433" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="453" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">The Overconfidence</text>
  <text x="453" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Problem</text>
  <rect x="826" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="826" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="846" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Attorney-Client</text>
  <text x="846" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Privilege and…</text>
  <text x="60" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">The courts issuing sanctions</text>
  <text x="60" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">are not prohibiting</text>
  <text x="60" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">AI-assisted legal research.</text>
  <text x="453" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Most AI systems are trained to</text>
  <text x="453" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">produce answers.</text>
  <text x="846" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">A separate, less-discussed</text>
  <text x="846" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">issue the sanctions pattern</text>
  <text x="846" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">raises is what happens to</text>
  <text x="846" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">attorney-client privilege when</text>
  <text x="846" y="202" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">legal</text>
</svg>