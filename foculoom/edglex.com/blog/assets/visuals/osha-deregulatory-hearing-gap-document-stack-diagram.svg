<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="400" y="60" width="400" height="80" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="420" y="95" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Why this specific</text>
  <text x="420" y="115" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">hearing cycle matters</text>
  <text x="420" y="120" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">The OSHA deregulatory page now</text>
  <text x="420" y="134" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">includes a formal hearing</text>
  <text x="420" y="148" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">timeline and a notice process</text>
  <text x="420" y="162" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">for participants who intend to</text>
  <rect x="380" y="160" width="400" height="80" fill="#F1F5F9" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="400" y="195" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">The practical risk map</text>
  <text x="400" y="220" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">There are three uncertainty</text>
  <text x="400" y="234" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">layers in this phase.</text>
  <rect x="360" y="260" width="400" height="80" fill="#E2E8F0" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="380" y="295" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Why this is a classic</text>
  <text x="380" y="315" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">law-gaps case</text>
  <text x="380" y="320" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">This is less a doctrinal mystery</text>
  <text x="380" y="334" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">than a sequencing problem.</text>
</svg>