<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="40" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="40" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="60" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What the No Surprises</text>
  <text x="60" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Act Requires</text>
  <rect x="433" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="433" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="453" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What the Agencies Did</text>
  <text x="453" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">— and What the Courts…</text>
  <rect x="826" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="826" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="846" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What Fills the Gap:</text>
  <text x="846" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Enforcement…</text>
  <text x="60" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">The No Surprises Act was</text>
  <text x="60" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">enacted as Division BB, Title</text>
  <text x="60" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">I of the Consolidated</text>
  <text x="60" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Appropriations Act, 2021, Pub.</text>
  <text x="453" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Implementing regulations for</text>
  <text x="453" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">the IDR process were issued</text>
  <text x="453" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">jointly by HHS, DOL, and</text>
  <text x="453" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Treasury.</text>
  <text x="846" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">After the vacaturs, HHS, DOL,</text>
  <text x="846" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">and Treasury issued FAQ</text>
  <text x="846" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">guidance (including FAQ Parts</text>
  <text x="846" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">62 and 69 under the ACA/CAA</text>
  <text x="846" y="202" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">series)</text>
</svg>