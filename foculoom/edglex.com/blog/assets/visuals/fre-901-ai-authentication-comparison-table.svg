  <text x="60" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">FRE 901(a): The</text>
  <text x="60" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">General Standard</text>
  <rect x="433" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="433" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="453" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">FRE 901(b)(9):</text>
  <text x="453" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Evidence About a…</text>
  <rect x="826" y="40" width="373" height="340" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="0" opacity="1.0"/>
  <rect x="826" y="40" width="373" height="60" fill="#1D4ED8" stroke="none" stroke-width="1" rx="0" opacity="0.12"/>
  <text x="846" y="60" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Three Contexts Where</text>
  <text x="846" y="80" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">This Analysis Applies</text>
  <text x="60" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Federal Rule of Evidence</text>
  <text x="60" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">901(a) states that to satisfy</text>
  <text x="60" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">the requirement of</text>
  <text x="60" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">authenticating or identifying</text>
  <text x="60" y="202" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">an item of</text>
  <text x="453" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">Federal Rule of Evidence</text>
  <text x="453" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">901(b) provides a</text>
  <text x="453" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">non-exhaustive list of</text>
  <text x="453" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">authentication methods.</text>
  <text x="846" y="130" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">The FRE 901 analysis is not a</text>
  <text x="846" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">single exercise — it varies</text>
  <text x="846" y="166" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">depending on what role</text>
  <text x="846" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">AI-generated content plays in</text>
  <text x="846" y="202" text-anchor="start" font-family="sans-serif" font-size="14" fill="#1F2937" font-weight="400">the</text>
