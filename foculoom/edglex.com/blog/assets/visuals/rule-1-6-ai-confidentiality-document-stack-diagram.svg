<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="400" y="60" width="400" height="80" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="420" y="95" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Rule 1.6(a): The</text>
  <text x="420" y="115" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">General…</text>
  <text x="420" y="120" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">ABA Model Rule 1.6(a) provides</text>
  <text x="420" y="134" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">that a lawyer shall not reveal</text>
  <text x="420" y="148" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">information relating to the</text>
  <text x="420" y="162" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">representation of a client</text>
  <rect x="380" y="160" width="400" height="80" fill="#F1F5F9" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="400" y="195" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Rule 1.6(c): The</text>
  <text x="400" y="215" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Reasonable Efforts…</text>
  <text x="400" y="220" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">ABA Model Rule 1.6(c) extends</text>
  <text x="400" y="234" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">beyond prohibiting unauthorized</text>
  <text x="400" y="248" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">disclosure.</text>
  <rect x="360" y="260" width="400" height="80" fill="#E2E8F0" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="380" y="295" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">What ABA Formal</text>
  <text x="380" y="315" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Opinion 512 Adds</text>
  <text x="380" y="320" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">ABA Formal Opinion 512 (July 29,</text>
  <text x="380" y="334" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">2024), issued by the ABA</text>
  <text x="380" y="348" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Standing Committee on Ethics and</text>
  <text x="380" y="362" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Professional Responsibility</text>
</svg>