<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="421" viewBox="0 0 1200 421">
  <rect x="0" y="0" width="1200" height="421" fill="#FFFFFF"/>
  <rect x="400" y="60" width="400" height="80" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="420" y="95" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Rule 3.3(a)(1): The</text>
  <text x="420" y="115" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Text and Its…</text>
  <text x="420" y="120" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">ABA Model Rule 3.3(a)(1)</text>
  <text x="420" y="134" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">provides that a lawyer shall not</text>
  <text x="420" y="148" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">knowingly make a false statement</text>
  <text x="420" y="162" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">of fact or law to a</text>
  <rect x="380" y="160" width="400" height="80" fill="#F1F5F9" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="400" y="195" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">The "Knowingly"</text>
  <text x="400" y="215" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Standard: When Actual…</text>
  <text x="400" y="220" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Rule 3.3(a)(1) requires actual</text>
  <text x="400" y="234" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">knowledge, not mere negligence.</text>
  <rect x="360" y="260" width="400" height="80" fill="#E2E8F0" stroke="#1D4ED8" stroke-width="3" rx="8" opacity="1.0"/>
  <text x="380" y="295" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">The Duty to Correct:</text>
  <text x="380" y="315" text-anchor="start" font-family="sans-serif" font-size="18" fill="#1D4ED8" font-weight="700">Rule 3.3(a)(1)'s…</text>
  <text x="380" y="320" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">Rule 3.3(a)(1) also imposes a</text>
  <text x="380" y="334" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">duty to correct false statements</text>
  <text x="380" y="348" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">of law previously made to the</text>
  <text x="380" y="362" text-anchor="start" font-family="sans-serif" font-size="12" fill="#475569" font-weight="400">tribunal.</text>
</svg>